server:
  port: 8081

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/neobank}

  cloud:
    gateway:
      routes:
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:9081}
          predicates:
            - Path=/api/accounts/**

        - id: transfer-service
          uri: ${TRANSFER_SERVICE_URL:http://localhost:9082}
          predicates:
            - Path=/api/transfers/**

        - id: beneficiary-service
          uri: ${BENEFICIARY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/beneficiaries/**

        - id: loan-service
          uri: ${LOAN_SERVICE_URL:http://localhost:8022}
          predicates:
            - Path=/api/loans/**

        - id: statement-service
          uri: ${STATEMENT_SERVICE_URL:http://localhost:9095}
          predicates:
            - Path=/api/statement/**

        - id: beneficiary-legacy-service
          uri: ${BENEFICIARY_LEGACY_SERVICE_URL:http://localhost:9696}
          predicates:
            - Path=/api/beneficiary/**

        - id: ledger-service
          uri: ${LEDGER_SERVICE_URL:http://localhost:9083}
          predicates:
            - Path=/api/ledger/**

        - id: schedule-service
          uri: ${SCHEDULE_SERVICE_URL:http://localhost:9084}
          predicates:
            - Path=/api/schedule/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  security:
    jwt:
      audience: neobank-api

management:
  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
