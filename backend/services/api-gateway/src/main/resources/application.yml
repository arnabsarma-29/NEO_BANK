server:
  port: 8081

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/neobank}

  cloud:
    gateway:
      routes:
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/accounts/**

        - id: transfer-service
          uri: ${TRANSFER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/transfers/**

        - id: beneficiary-service
          uri: ${BENEFICIARY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/beneficiaries/**

        - id: loan-service
          uri: ${LOAN_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/loans/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  security:
    jwt:
      audience: neobank-api
