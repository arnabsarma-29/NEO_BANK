server:
  port: 9084

spring:
  application:
    name: schedule-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neobank_schedule}
    username: ${SPRING_DATASOURCE_USERNAME:neobank_schedule_app}
    password: schedule_app
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${FLYWAY_USER:neobank_schedule_migrator}
    password: schedule_migrator

neobank:
  transfer:
    url: ${TRANSFER_SERVICE_URL:http://localhost:9082}
  schedule:
    transfer-service-token: ${NEOBANK_INTERNAL_SCHEDULE_TOKEN:dev-schedule-to-transfer-token-secret-local}
    worker:
      enabled: ${NEOBANK_SCHEDULE_WORKER_ENABLED:true}
      fixed-delay-ms: ${NEOBANK_SCHEDULE_WORKER_DELAY_MS:5000}
      initial-delay-ms: ${NEOBANK_SCHEDULE_WORKER_INITIAL_DELAY_MS:5000}
      batch-size: ${NEOBANK_SCHEDULE_WORKER_BATCH_SIZE:10}
