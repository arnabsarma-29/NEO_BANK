server:
  port: 0

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:h2:mem:neobank_ledger;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE ROLE IF NOT EXISTS neobank_ledger_app
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: sa
    password: 

neobank:
  security:
    internal:
      transfer-token: dev-transfer-to-ledger-token-secret-local

