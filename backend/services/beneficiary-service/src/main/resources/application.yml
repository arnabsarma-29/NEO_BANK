server:
  port: 9696
  servlet:
    context-path: /api/v1

spring:
  application:
    name: beneficiary-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/neobank_beneficiary?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:tiger}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
#  flyway:
#    enabled: true
#    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: beneficiary-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.neobank.*"

neobank:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  internal:
    secret: ${INTERNAL_API_SECRET:neobank-internal-service-secret-token}
  beneficiary:
    cooling-period-minutes: ${BENEFICIARY_COOLING_MINUTES:30}   # TBD in PRD - placeholder
    auto-activation-enabled: ${BENEFICIARY_AUTO_ACTIVATION_ENABLED:false} # Feature toggle - disabled by default pending PO approval
    activation-job-cron: "0 * * * * *"
  kafka-topics:
    beneficiary-activated: beneficiary.activated
    audit: audit.events
  clients:
    account:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8082/api/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.neobank: ${LOG_LEVEL:DEBUG}
